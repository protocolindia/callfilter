plugins {
    id 'com.android.application'
}

android {
    namespace 'pro.onephone.callfilter'
    compileSdk 34

    defaultConfig {
        applicationId "pro.onephone.callfilter"
        minSdk 26
        targetSdk 34
        versionCode 86
        versionName "2.0"

        buildConfigField "String", "BACKEND_URL", "\"https://api.app.onephone.pro\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def keystoreFile = System.getenv("KEYSTORE_FILE") ?: "${rootDir}/keystore/release.keystore"
            def keystoreProps = new Properties()
            def propsFile = file("${rootDir}/keystore/keystore.properties")
            if (propsFile.exists()) {
                keystoreProps.load(new FileInputStream(propsFile))
            }
            storeFile     file(keystoreFile)
            storePassword keystoreProps['storePassword'] ?: System.getenv("KEYSTORE_PASSWORD") ?: "changeme"
            keyAlias      keystoreProps['keyAlias']      ?: System.getenv("KEY_ALIAS")        ?: "callfilter"
            keyPassword   keystoreProps['keyPassword']   ?: System.getenv("KEY_PASSWORD")     ?: "changeme"
        }
    }

    flavorDimensions += "distribution"
    productFlavors {
        playstore {
            dimension "distribution"
            buildConfigField "String", "BILLING_PROVIDER", "\"play\""
        }
        sideload {
            dimension "distribution"
            buildConfigField "String", "BILLING_PROVIDER", "\"razorpay\""
            // Razorpay's checkout SDK is added via dependencies below
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.4'
    // Google Play Billing — included in BOTH flavors, but only used in 'playstore'
    // (it's small and lets PlayBillingManager compile in all variants)
    implementation 'com.android.billingclient:billing:7.1.1'
    // Razorpay Checkout SDK — only in sideload flavor
    sideloadImplementation 'com.razorpay:checkout:1.6.41'
    // SMS User Consent API — auto-reads the incoming OTP with a one-tap popup
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.1.0'
}
