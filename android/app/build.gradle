plugins {
    id 'com.android.application'
}

// Apply Firebase google-services only when the config file is present, so the
// build still works before you add your Firebase project.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'pro.onephone.callfilter'
    compileSdk 34

    defaultConfig {
        applicationId "pro.onephone.callfilter"
        minSdk 26
        targetSdk 34
        versionCode 128
        versionName "6.2"

        buildConfigField "String", "BACKEND_URL", "\"https://api.app.onephone.pro\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def keystoreFile = System.getenv("KEYSTORE_FILE") ?: "${rootDir}/keystore/release.keystore"
            def keystoreProps = new Properties()
            def propsFile = file("${rootDir}/keystore/keystore.properties")
            if (propsFile.exists()) {
                keystoreProps.load(new FileInputStream(propsFile))
            }
            storeFile     file(keystoreFile)
            storePassword keystoreProps['storePassword'] ?: System.getenv("KEYSTORE_PASSWORD") ?: "changeme"
            keyAlias      keystoreProps['keyAlias']      ?: System.getenv("KEY_ALIAS")        ?: "callfilter"
            keyPassword   keystoreProps['keyPassword']   ?: System.getenv("KEY_PASSWORD")     ?: "changeme"
        }
    }

    // True only when a real release keystore is present on the build machine.
    def hasReleaseKeystore = file("${rootDir}/keystore/release.keystore").exists() ||
                             (System.getenv("KEYSTORE_FILE") != null)

    flavorDimensions += "distribution"
    productFlavors {
        playstore {
            dimension "distribution"
            buildConfigField "String", "BILLING_PROVIDER", "\"play\""
        }
        sideload {
            dimension "distribution"
            buildConfigField "String", "BILLING_PROVIDER", "\"razorpay\""
            // Razorpay's checkout SDK is added via dependencies below
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            if (hasReleaseKeystore) {
                // Production build: real signing + size optimizations
                minifyEnabled true
                shrinkResources true
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                signingConfig signingConfigs.release
            } else {
                // No release keystore present: sign with the debug key so the
                // APK is still installable for sideload testing. Disable minify
                // to avoid any ProGuard issues during testing.
                minifyEnabled false
                shrinkResources false
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.4'
    // Google Play Billing — included in BOTH flavors, but only used in 'playstore'
    // (it's small and lets PlayBillingManager compile in all variants)
    implementation 'com.android.billingclient:billing:7.1.1'
    // Razorpay Checkout SDK — only in sideload flavor
    sideloadImplementation 'com.razorpay:checkout:1.6.41'
    // SMS User Consent API — auto-reads the incoming OTP with a one-tap popup
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.1.0'
    // Firebase Cloud Messaging — wakes the app to refresh the global blocklist.
    // Requires your google-services.json (see FCM_SETUP.md).
    implementation 'com.google.firebase:firebase-messaging:24.0.0'
}
